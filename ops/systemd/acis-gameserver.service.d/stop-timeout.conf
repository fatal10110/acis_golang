# Drop-in for acis-gameserver.service. Install it once on the server:
#   install -D -m 644 stop-timeout.conf /etc/systemd/system/acis-gameserver.service.d/stop-timeout.conf
#   systemctl daemon-reload
#
# systemd's default 90s stop timeout is shorter than the game server's own
# worst-case shutdown (gameServerStopTimeout in cmd/gameserver/main.go): on a
# slow database systemd would SIGKILL the process before its final saves.
# TestSystemdStopTimeoutCoversGameServerStop keeps this value above it.
[Service]
TimeoutStopSec=240
