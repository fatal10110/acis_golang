version: '3.8'

# Single shared MariaDB instance for `go test`. Every integration test
# package/function creates its own database on it (see internal/dbtest)
# instead of each one starting its own testcontainer.
#
# Host networking skips docker-proxy on the 127.0.0.1:3307 hop, which is
# measurably slower under parallel test runs (it needs Linux Docker, or
# Docker Desktop with host networking enabled). The data lives on tmpfs, so
# durability settings are relaxed, and max_connections leaves room for
# several concurrent `go test` runs sharing the instance.
services:
  test-db:
    image: mariadb:11
    container_name: acis-test-mariadb
    network_mode: host
    command:
      - --port=3307
      - --bind-address=127.0.0.1
      - --skip-log-bin
      - --innodb-flush-log-at-trx-commit=0
      - --innodb-doublewrite=0
      - --max-connections=1000
      - --table-open-cache=4000
      - --table-definition-cache=4000
    environment:
      MARIADB_ROOT_PASSWORD: test
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "no"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
