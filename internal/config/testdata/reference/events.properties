#   Default : 5
FestivalMinPlayer =REDACTED

# Maximum contribution per player during festival
#   /!\ This value is NOT impacted by server drop rate. 
MaxPlayerContrib =REDACTED

# Festival Manager Start time.
#   Default : 2 minutes
FestivalManagerStart =REDACTED

# Festival Length.
#   Default : 18 minutes
FestivalLength =REDACTED

# Festival Cycle Length.
#   Default : 38 Minutes (20 minutes wait time, + Festival time) 
FestivalCycleLength =REDACTED

# At what point the first festival spawn occures.
#   Default : 2 minutes
FestivalFirstSpawn =REDACTED

# At what Point the first festival swarm occures.
#   Default : 5 minutes
FestivalFirstSwarm =REDACTED

# At what Point the Second Festival spawn occures.
#   Default : 9 minutes
FestivalSecondSpawn =REDACTED

# At what Point the Second Festival Swarm occures.
#   Default : 12 minutes
FestivalSecondSwarm =REDACTED

# At what point the Chests Spawn in.
#   Default : 15 minutes
FestivalChestSpawn =REDACTED

