############################################################
#  	Global properties
############################################################

# "handlers" specifies a comma separated list of log Handler classes. 
# These handlers will be installed during VM startup. Note that these classes must be on the system classpath.
# By default we only configure a ConsoleHandler, which will only show messages at the INFO and above levels.
#handlers= java.util.logging.ConsoleHandler

# To also add the FileHandler, use the following line instead.
handlers =REDACTED
		java.util.logging.ConsoleHandler,\
		net.sf.l2j.commons.logging.handler.ErrorLogHandler
           
chat.handlers =REDACTED
chat.useParentHandlers =REDACTED

gmaudit.handlers =REDACTED
gmaudit.useParentHandlers =REDACTED

item.handlers =REDACTED
item.useParentHandlers =REDACTED


# Default global logging level.
# This specifies which kinds of events are logged across all loggers. 
# For any given facility this global level can be overriden by a facility specific level
# Note that the ConsoleHandler also has a separate level setting to limit messages printed to the console.
.level=REDACTED

############################################################
# Handler specific properties.
# Describes specific configuration info for Handlers.
############################################################

# console
java.util.logging.ConsoleHandler.formatter =REDACTED
java.util.logging.ConsoleHandler.level =REDACTED

# default file output is in user's home directory.
java.util.logging.FileHandler.pattern =REDACTED
java.util.logging.FileHandler.limit =REDACTED
java.util.logging.FileHandler.count =REDACTED
java.util.logging.FileHandler.formatter =REDACTED
java.util.logging.FileHandler.level =REDACTED

# log errors (exceptions)
net.sf.l2j.commons.logging.handler.ErrorLogHandler.pattern =REDACTED
net.sf.l2j.commons.logging.handler.ErrorLogHandler.limit =REDACTED
net.sf.l2j.commons.logging.handler.ErrorLogHandler.count =REDACTED
net.sf.l2j.commons.logging.handler.ErrorLogHandler.formatter =REDACTED
net.sf.l2j.commons.logging.handler.ErrorLogHandler.filter =REDACTED
net.sf.l2j.commons.logging.handler.ErrorLogHandler.level =REDACTED

