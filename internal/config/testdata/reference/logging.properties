net.sf.l2j.commons.logging.handler.ChatLogHandler.limit =REDACTED
net.sf.l2j.commons.logging.handler.ChatLogHandler.count =REDACTED
net.sf.l2j.commons.logging.handler.ChatLogHandler.formatter =REDACTED
net.sf.l2j.commons.logging.handler.ChatLogHandler.filter =REDACTED
net.sf.l2j.commons.logging.handler.ChatLogHandler.append =REDACTED
net.sf.l2j.commons.logging.handler.ChatLogHandler.level =REDACTED

# log GM Audit
