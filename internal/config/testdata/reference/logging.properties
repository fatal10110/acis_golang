net.sf.l2j.commons.logging.handler.GMAuditLogHandler.limit =REDACTED
net.sf.l2j.commons.logging.handler.GMAuditLogHandler.count =REDACTED
net.sf.l2j.commons.logging.handler.GMAuditLogHandler.formatter =REDACTED
net.sf.l2j.commons.logging.handler.GMAuditLogHandler.filter =REDACTED
