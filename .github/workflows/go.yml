name: Go

on:
  # Branch pushes are covered by pull_request (the ruleset requires an
  # up-to-date PR). main pushes still run: they trigger Deploy and are the
  # only runs whose Go build cache other branches can restore.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The slowest behavior suites get their own runners. In a single
        # `go test ./...` they queue behind compiling every other package.
        # `rest` runs cmd and internal, `suites` every other behavior suite;
        # keep the `suites` exclusion list in sync with the suites named here.
        #
        # A shard runs either `pkgs` on the inline executor or `pool` on the
        # real pool, so the two passes over a suite run side by side. Each
        # shard saves its own cache, which also holds its test results; until
        # it has one, it starts from its inline sibling's (`cache`). A restore
        # key matches by prefix, so no shard name may begin with another's.
        shard:
          - name: skills-pets
            cache: skills-pets
            pkgs: ./tests/skills ./tests/pets
          - name: pool-skills-pets
            cache: skills-pets
            pool: ./tests/skills ./tests/pets
          - name: combat-items
            cache: combat-items
            pkgs: ./tests/combat ./tests/items
          - name: pool-combat-items
            cache: combat-items
            pool: ./tests/combat ./tests/items
          - name: rest
            cache: rest
            pkgs: ./cmd/... ./internal/...
          - name: suites
            cache: rest
            pkgs: suites
          - name: pool-rest
            cache: rest
            pool: ./tests/character ./tests/lifecycle ./tests/trade ./tests/social
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # setup-go keys its cache on go.sum only, so it is saved once and
          # never refreshed. Cache per shard and commit instead.
          cache: false

      - name: Restore Go cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ matrix.shard.name }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ matrix.shard.name }}-
            go-${{ runner.os }}-${{ matrix.shard.cache }}-

      # main saves only the build cache entries its own run used, so the cache
      # does not carry every earlier build forward and grow without bound. Go
      # refreshes an entry's mtime when it uses one older than an hour, so
      # backdating them all first marks every entry this run reads. Two hours
      # stays well inside Go's own 5-day trim.
      - name: Mark Go cache entries unused
        if: github.event_name == 'push'
        run: |
          mkdir -p ~/.cache/go-build
          find ~/.cache/go-build -type f -name '*-[ad]' -exec touch -d '2 hours ago' {} +
          touch "$RUNNER_TEMP/go-cache-start"

      # No separate build or vet step: lint type-checks every package and runs
      # govet, and docker builds the binaries.
      #
      # gotest.sh keeps the log to package results and failing tests' output,
      # and ends it with the slowest packages and tests.
      - name: Test
        if: matrix.shard.pkgs
        env:
          PKGS: ${{ matrix.shard.pkgs }}
        run: |
          if [ "$PKGS" = suites ]; then
            PKGS="$(go list ./tests/... | grep -vE '/tests/(skills|pets|combat|items)$')"
          fi
          # shellcheck disable=SC2086 # PKGS is a space-separated package list
          .github/scripts/gotest.sh -race $PKGS

      # Behavior suites run on sim.Inline with a test-driven clock by
      # default; this keeps their run on the real pool, with real
      # interleavings. On the wall clock most of a test is spent waiting out
      # cast, swing and stand-up times, so far more tests than GOMAXPROCS
      # run at once.
      - name: Test (real pool)
        if: matrix.shard.pool
        env:
          ACIS_SIM_EXECUTOR: pool
          PKGS: ${{ matrix.shard.pool }}
        run: |
          # shellcheck disable=SC2086 # PKGS is a space-separated package list
          .github/scripts/gotest.sh -race -parallel 16 $PKGS

      - name: Test (simdebug)
        if: matrix.shard.name == 'rest'
        run: .github/scripts/gotest.sh -race -tags simdebug ./internal/gameserver/sim/...

      # Go skips writing an output it already holds byte for byte, so an
      # action entry written this run can name an output file left backdated;
      # keep the output of every kept entry before dropping the rest.
      - name: Drop Go cache entries this run did not use
        if: github.event_name == 'push'
        run: |
          cd ~/.cache/go-build
          find . -type f -name '*-a' -newer "$RUNNER_TEMP/go-cache-start" \
            -exec awk '{print substr($3, 1, 2) "/" $3 "-d"}' {} + | xargs -r touch -c
          find . -type f -name '*-[ad]' ! -newer "$RUNNER_TEMP/go-cache-start" -delete

      # Only main saves, so every branch can restore it.
      - name: Save Go cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ matrix.shard.name }}-${{ github.sha }}

  # Runs the linters and the gofumpt formatter from .golangci.yml.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  # Builds the Dockerfile, runs its binaries, and seeds the compose db from a
  # stub datapack and from the real aCis_datapack schema
  # (ops/docker/smoke-test.sh). Not path-filtered: a Go change (a cgo-only
  # dependency, a package under an ignored directory) can break the static
  # image build as surely as a Dockerfile change can.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Whether the read-only token for the private repository that holds
      # aCis_datapack is set. Only the checkout step sees the token itself,
      # not the steps that run this branch's code. Workflows triggered from
      # forks get no secrets; those runs check only the stub datapack.
      HAS_DATAPACK_TOKEN: ${{ secrets.ACIS_DATAPACK_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Only the schema: sql/ holds one file per table, tools/ the
      # full_install.sql that drops them first.
      - name: Check out the aCis_datapack schema
        if: env.HAS_DATAPACK_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: fatal10110/acis_public
          token: ${{ secrets.ACIS_DATAPACK_TOKEN }}
          path: acis-datapack
          persist-credentials: false
          sparse-checkout: |
            aCis_datapack/sql
            aCis_datapack/tools

      - name: Docker smoke test
        run: |
          if [ "$HAS_DATAPACK_TOKEN" = true ]; then
            # Out of the image's build context.
            mv acis-datapack "$RUNNER_TEMP/"
            export ACIS_SMOKE_DATAPACK="$RUNNER_TEMP/acis-datapack/aCis_datapack"
          else
            echo "::warning::ACIS_DATAPACK_TOKEN is not set; the real aCis_datapack schema is not checked"
          fi
          ops/docker/smoke-test.sh

  # The ruleset requires a single check named "go"; it passes only when
  # every shard, the lint job and the Docker smoke test do.
  go:
    if: always()
    needs: [test, lint, docker]
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.test.result }}" = success ] && [ "${{ needs.lint.result }}" = success ] && [ "${{ needs.docker.result }}" = success ]'
