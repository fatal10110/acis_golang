name: Deploy

# Deploys only when someone publishes a GitHub release; the release's tag
# selects the commit. Merges to main no longer deploy by themselves.
on:
  release:
    types: [published]

permissions: {}

# One deploy at a time.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Attaches the built binaries and the datapack to the release.
      contents: write
      # Reads the tag commit's CI result.
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      # A release can be published from any commit; deploy only one whose
      # aggregate "go" check (go.yml) passed, before building or uploading.
      - name: Require a green CI run for the tag
        run: |
          sha="$(git rev-parse HEAD)"
          conclusion="$(gh api "repos/$GH_REPO/commits/$sha/check-runs?check_name=go&filter=latest" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.completed_at) | last | .conclusion // "none"')"
          if [ "$conclusion" != success ]; then
            echo "::error::check go on $sha is '$conclusion', not success; refusing to deploy $TAG"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # Built here so the production box never compiles next to the running
      # gameserver. The box is arm64 (Oracle Cloud A1); the webhook installs
      # these binaries as they are, so GOARCH must match it.
      - name: Build binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath -o dist/gameserver ./cmd/gameserver
          go build -trimpath -o dist/loginserver ./cmd/loginserver
      # The datapack ships next to the binaries, never geodata. The package
      # step checks the copy against ops/datapack.sha256 first, so a copy that
      # drifted from its manifest fails the job before anything is uploaded.
      - name: Package the datapack
        run: |
          ops/datapack-manifest.sh package dist/datapack.tar.zst
          cp ops/datapack.sha256 dist/datapack.sha256
          (cd dist && sha256sum gameserver loginserver datapack.tar.zst datapack.sha256 > SHA256SUMS)
      # A re-run replaces the assets.
      - name: Attach the release assets
        run: gh release upload "$TAG" dist/* --clobber
      # The server pulls the release assets itself and answers after the swap
      # and restart, so a failed deploy fails this job; the gameserver stop can
      # take up to 240s.
      - name: Deploy
        env:
          # Full webhook URL; a secret so the deploy host stays out of the
          # public repo and logs.
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          # Only the whole secret is masked; curl errors print the bare host.
          host=${DEPLOY_URL#*://}
          echo "::add-mask::${host%%/*}"
          curl -sS --fail-with-body --max-time 600 -X POST "$DEPLOY_URL" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "X-Deploy-Tag: $TAG"
