name: Deploy

on:
  workflow_run:
    workflows: ["Go"]
    branches: [main]
    types: [completed]

permissions: {}

# One deploy at a time; a newer main run replaces a queued older one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Lets the webhook download this run's artifact with the job token.
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # Built here so the 4 GB production box never compiles next to the
      # running gameserver.
      - name: Build binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -o dist/gameserver ./cmd/gameserver
          go build -trimpath -o dist/loginserver ./cmd/loginserver
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7
      # The server pulls the artifact of this run with the job token, which
      # expires when the job ends. The webhook answers after the swap and
      # restart, so a failed deploy fails this job; the gameserver stop can
      # take up to 240s.
      - name: Deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -sS --fail-with-body --max-time 600 -X POST https://deploy.iterharbor.com/deploy \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "X-GitHub-Token: $GH_TOKEN" \
            -H "X-Deploy-Run: $RUN_ID"
