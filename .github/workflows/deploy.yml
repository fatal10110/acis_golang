name: Deploy

on:
  workflow_run:
    workflows: ["Go"]
    branches: [main]
    types: [completed]

permissions: {}

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger deploy webhook
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://deploy.iterharbor.com/deploy \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}")
          echo "webhook status: $status"
          [ "$status" = "202" ]
