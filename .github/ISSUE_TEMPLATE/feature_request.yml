name: Feature or change
description: Propose a missing system, a change in behavior, or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Who needs this, and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it should work, as seen by players or operators.
    validations:
      required: true
  - type: dropdown
    id: reference
    attributes:
      label: Relation to the aCis Java server
      description: The Go server aims to behave like the Java server (docs/decisions/0001).
      options:
        - The Java server already does this; the Go server is missing it
        - This would differ from the Java server on purpose
        - Not related to game behavior (tools, operations, docs)
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the problem, and why you prefer this one.
